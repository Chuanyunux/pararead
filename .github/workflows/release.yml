name: Release

# Push a tag like v0.1.0 (matching package.json "version") to publish a GitHub
# Release with the packaged extension (.vsix) attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check version matches tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$TAG" ]; then
            echo "package.json version $version does not match tag $TAG" >&2
            exit 1
          fi
      - name: Typecheck, lint and test
        run: pnpm run check && pnpm test
      - name: Package VSIX
        run: pnpm exec vsce package --no-dependencies --out "pdf-bilingual-reader-${{ github.ref_name }}.vsix"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: pdf-bilingual-reader-${{ github.ref_name }}.vsix
          generate_release_notes: true
